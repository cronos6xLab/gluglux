<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen desde ImgBB</title>
    <style>
        /* Estilo básico para centrar la imagen y dar un fondo limpio */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .image-container {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .caption {
            margin-top: 12px;
            color: #555;
            font-size: 0.95rem;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- 
            URL directa de la imagen obtenida de ImgBB.
            La imagen es "IMG 6943" alojada en el enlace proporcionado.
        -->
        <img 
            src="https://i.ibb.co/1sKVJp8/IMG-6943.jpg" 
            alt="IMG 6943 - Imagen alojada en ImgBB" 
            loading="lazy"
        >
        <div class="caption">
            <strong>IMG 6943</strong> · Imagen alojada en 
            <a href="https://ibb.co/6J7zXvW0" target="_blank" rel="noopener noreferrer">ImgBB</a>
        </div>
    </div>
</body>
</html>
